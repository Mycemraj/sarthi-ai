<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sarthi AI Solutions | Geospatial · Environmental · AI/ML Intelligence</title>
    <meta
      name="description"
      content="Sarthi AI Solutions delivers geospatial intelligence, environmental impact assessments, disaster risk solutions, drone surveys, and AI/ML-enabled analytics for infrastructure, industrial, and renewable energy projects."
    />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
